# Class-project deployment: reuse the existing database, create only a free API.
services:
  - type: web
    name: real-pacman-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: Server
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: RealPacmanGame-Postgres
          property: connectionString
      # Render's private PostgreSQL certificates are self-signed. Use its private
      # network explicitly; public/external database connections must require TLS.
      - key: DATABASE_TLS_MODE
        value: disable
      - key: HOST
        value: 0.0.0.0
      - key: AUTO_MIGRATE
        value: "false"
      - key: MIGRATE_ON_START
        value: "true"
