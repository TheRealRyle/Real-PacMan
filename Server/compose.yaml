services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: realpacman_dev
      POSTGRES_USER: realpacman
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - realpacman_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realpacman -d realpacman_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  realpacman_database:
